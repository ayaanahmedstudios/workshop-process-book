<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process Book / Home</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@400..700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: "Departure Mono";
    src: url("fonts/DepartureMono-Regular.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --bg: #f4f4f0;
    --fg: #111111;
    --sans: "Stack Sans Text", sans-serif;
    --mono: "Departure Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    letter-spacing: -0.03em;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .card {
    border: 2px solid var(--fg);
    padding: 3.5rem 4rem;
    max-width: 560px;
    width: 100%;
    background-color: var(--bg);
    box-shadow: 6px 6px 0px var(--fg);
  }

  header {
    margin-bottom: 2.5rem;
  }

  header img {
    height: 36px;
    filter: invert(1);
  }

  h1 {
    font-family: var(--sans);
    font-size: 3.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem 0;
    line-height: 1.05;
  }

  .wip {
    font-size: 0.85rem;
    color: #666;
    margin: 0 0 2.5rem 0;
    text-transform: uppercase;
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--fg);
    text-decoration: none;
    padding: 12px 24px;
    border: 2px solid var(--fg);
    background-color: var(--bg);
  }

  .btn:hover:not(.disabled) {
    background-color: var(--fg);
    color: var(--bg);
  }

  .btn.disabled {
    color: #888;
    border-color: #888;
    text-decoration: line-through;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="card">
  <header>
    <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
  </header>

  <h1>Process Book</h1>
  <p class="wip">[work in progress]</p>

  <div class="links">
    <a href="workshop-1.html" class="btn">Workshop 1</a>
    <span class="btn disabled">Workshop 2</span>
  </div>
</div>

</body>
</html>
