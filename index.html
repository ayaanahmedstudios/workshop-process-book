<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process Book / Home</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f4f0; 
    --fg: #111111;
    --sans: "Geist", sans-serif;
    --mono: "Geist Pixel", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    max-width: 900px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1, h2 {
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  h1 {
    font-size: 3rem;
  }

  h2 {
    font-size: 1.75rem;
    margin-bottom: 0.5rem;
  }

  .wip {
    font-family: var(--mono);
    font-size: 1rem;
    color: #888;
    font-weight: 400;
    vertical-align: middle;
    margin-left: 10px;
    letter-spacing: normal;
  }

  header {
    display: flex;
    padding-bottom: 1rem;
    margin-bottom: 2rem;
  }

  header img {
    height: 32px;
    filter: invert(1);
  }

  footer {
    padding-top: 1rem;
    margin-top: auto;
  }

  footer p {
    font-family: var(--mono);
    font-size: 0.95rem;
    margin: 0;
  }

  .intro {
    margin-bottom: 3rem;
  }

  .intro p {
    font-family: var(--mono);
    font-size: 0.95rem;
    margin: 0.5rem 0 0 0;
  }

  .links {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .btn {
    display: inline-flex;
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--fg);
    text-decoration: none;
    padding: 10px 20px;
    border: 2px solid var(--fg);
    box-shadow: 4px 4px 0px var(--fg);
    background-color: var(--bg);
    transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s, color 0.1s;
    cursor: pointer;
  }

  .btn:hover:not(.disabled) {
    background-color: var(--fg);
    color: var(--bg);
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px var(--fg);
  }

  .btn.disabled {
    color: #888;
    border-color: #888;
    box-shadow: 4px 4px 0px #888;
    text-decoration: line-through;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
</header>

<div class="intro">
  <h1>Unlikely + Time + Scale <span class="wip">[work in progress]</span></h1>
  <p>Process Book</p>
</div>

<div class="links">
  <a href="workshop-1.html" class="btn">Workshop 1</a>
  <span class="btn disabled">Workshop 2</span>
</div>

<footer>
  <p>Ayaan Ahmed</p>
</footer>

</body>
</html>
