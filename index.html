<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process Book / Home</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f4f0; 
    --fg: #111111;
    --sans: "DM Sans", sans-serif;
    --mono: "Geist Pixel", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
  }

  p, h1, h2, h3, li, a {
    text-wrap: pretty;
  }

  h1, h2, h3 {
    text-wrap: balance;
  }

  h1, h2 {
    font-weight: 500;
    margin: 0;
    line-height: 1.2;
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }

  h2 {
    font-size: 1.5rem;
    font-weight: 400;
  }

  .wip {
    font-family: var(--mono);
    font-size: 1rem;
    color: #888;
    vertical-align: middle;
    margin-left: 8px;
  }

  header {
    display: flex;
    padding-bottom: 1rem;
    margin-bottom: 4rem;
  }

  header img {
    height: 32px;
    filter: invert(1);
  }

  .intro {
    margin-bottom: 3rem;
  }

  .links {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .btn {
    display: inline-flex;
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--fg);
    text-decoration: none;
    padding: 10px 20px;
    border: 2px solid var(--fg);
    background-color: var(--bg);
    transition: background-color 0.2s, color 0.2s;
    cursor: pointer;
  }

  .btn:hover:not(.disabled) {
    background-color: var(--fg);
    color: var(--bg);
  }

  .btn.disabled {
    color: #888;
    border-color: #888;
    text-decoration: line-through;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
</header>

<div class="intro">
  <h1>Process Book</h1>
  <h2>Unlikely + Time + Scale <span class="wip">[work in progress]</span></h2>
</div>

<div class="links">
  <a href="workshop-1.html" class="btn">Workshop 1</a>
  <span class="btn disabled">Workshop 2</span>
</div>

</body>
</html>
