<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W2 / Process</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f4f0; 
    --fg: #111111;
    --sans: "Geist", sans-serif;
    --mono: "Geist Pixel", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    max-width: 900px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-weight: 500;
    margin: 0;
    font-size: 3rem;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  header {
    display: flex;
    padding-bottom: 1rem;
    margin-bottom: 2rem;
  }

  header img {
    height: 32px;
    filter: invert(1);
  }

  footer {
    padding-top: 1rem;
    margin-top: auto;
  }

  footer p {
    font-family: var(--mono);
    font-size: 0.95rem;
    margin: 0;
  }

  .back {
    display: inline-flex;
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--fg);
    text-decoration: none;
    padding: 6px 12px;
    border: 2px solid var(--fg);
    box-shadow: 4px 4px 0px var(--fg);
    margin-bottom: 2rem;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .back:hover {
    background-color: var(--fg);
    color: var(--bg);
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px var(--fg);
  }

  .intro {
    margin-bottom: 3rem;
  }

  .intro p {
    font-family: var(--mono);
    font-size: 0.95rem;
    margin: 0.5rem 0 0 0;
  }

  p.soon {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: #888;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
</header>

<a class="back" href="index.html">&larr; Home</a>

<div class="intro">
  <h1>Unlikely + Time + Scale</h1>
  <p>Process Book</p>
</div>

<p class="soon">Workshop 2 coming soon.</p>

<footer>
  <p>Ayaan Ahmed</p>
</footer>

</body>
</html>
