<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W2 / Process</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f4f0; 
    --fg: #111111;
    --sans: "DM Sans", sans-serif;
    --mono: "Geist Pixel", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
  }

  p, h1 {
    text-wrap: pretty;
  }

  h1 {
    text-wrap: balance;
    font-weight: 500;
    margin: 0;
    font-size: 3rem;
    line-height: 1.2;
  }

  header {
    display: flex;
    padding-bottom: 1rem;
    margin-bottom: 2rem;
  }

  header img {
    height: 32px;
    filter: invert(1);
  }

  .back {
    display: inline-flex;
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--fg);
    text-decoration: none;
    padding: 6px 12px;
    border: 2px solid var(--fg);
    margin-bottom: 4rem;
    transition: background-color 0.2s, color 0.2s;
  }

  .back:hover {
    background-color: var(--fg);
    color: var(--bg);
  }

  .intro {
    margin-bottom: 3rem;
  }

  .intro p {
    font-family: var(--mono);
    font-size: 0.95rem;
    margin: 0.5rem 0 0 0;
  }

  p.soon {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: #888;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<header>
  <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
</header>

<a class="back" href="index.html">&larr; Home</a>

<div class="intro">
  <h1>Process Book</h1>
  <p>Unlikely + Time + Scale</p>
</div>

<p class="soon">Workshop 2 coming soon.</p>

</body>
</html>
