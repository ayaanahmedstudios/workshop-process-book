<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W2 / Process</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@400..700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: "Departure Mono";
    src: url("fonts/DepartureMono-Regular.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --bg: #f4f4f0;
    --fg: #111111;
    --sans: "Stack Sans Text", sans-serif;
    --mono: "Departure Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    letter-spacing: -0.03em;
    line-height: 1.6;
  }

  h1 {
    font-family: var(--sans);
    letter-spacing: -0.02em;
    font-weight: 600;
    margin: 0;
    font-size: 3.5rem;
    line-height: 1.15;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 3rem;
    border-bottom: 2px solid var(--fg);
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .top-bar img {
    height: 32px;
    filter: invert(1);
    display: block;
  }

  .back {
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--fg);
    text-decoration: none;
    padding: 8px 16px;
    border: 2px solid var(--fg);
  }

  .back:hover {
    background-color: var(--fg);
    color: var(--bg);
  }

  .soon {
    padding: 4rem 3rem;
    font-size: 0.95rem;
    color: #666;
    margin: 0;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed">
    <h1>Process Book</h1>
  </div>
  <a class="back" href="index.html">&larr; Home</a>
</div>

<p class="soon">Workshop 2 coming soon.</p>

</body>
</html>
